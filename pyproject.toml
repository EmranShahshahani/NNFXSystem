[project]
name = "nnfx"
version = "0.1.0"
description = "NNFX engine and validation platform: one pure strategy engine, a backtest harness, a live harness, and the pre-registered verdict."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1,<2.5",  # pandas 2.3 trips numpy 2.5 timedelta deprecations
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
crypto = ["ccxt>=4.4,<5"]

[project.scripts]
nnfx = "nnfx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nnfx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["nnfx"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF012: indicator defaults/grid are ClassVar tables declared on the base class.
# E501: the formatter owns line length; what remains is long strings.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "E501"]
