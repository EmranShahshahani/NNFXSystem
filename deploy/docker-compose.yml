# Beta stack: the NNFX web app behind Caddy (automatic HTTPS), an hourly data refresh,
# and the order-book recorder (Nobitex books every NNFX_ORDERBOOK_INTERVAL seconds).
#   cp deploy/.env.example deploy/.env   # set NNFX_DOMAIN
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: nnfx-beta
    restart: unless-stopped
    volumes:
      - beta-db:/app/runs/beta
      - market-data:/app/data/cache
    expose: ["8765"]

  refresh:
    image: nnfx-beta
    restart: unless-stopped
    environment:
      NNFX_SYMBOLS: ${NNFX_SYMBOLS:-BTC/USDT ETH/USDT}
    volumes:
      - market-data:/app/data/cache
      - ./refresh-data.sh:/app/deploy-refresh.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /app/deploy-refresh.sh; sleep 3600; done"]

  orderbook:
    image: nnfx-beta
    restart: unless-stopped
    environment:
      NNFX_ORDERBOOK_SYMBOLS: ${NNFX_ORDERBOOK_SYMBOLS:-BTC/IRT USDT/IRT}
      NNFX_ORDERBOOK_INTERVAL: ${NNFX_ORDERBOOK_INTERVAL:-10}
    volumes:
      - orderbook-data:/app/data/orderbook
    # Word splitting of the symbol list is intended.
    entrypoint: ["/bin/sh", "-c", "exec /app/.venv/bin/nnfx orderbook record --symbols $$NNFX_ORDERBOOK_SYMBOLS --interval $$NNFX_ORDERBOOK_INTERVAL --root /app/data/orderbook"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      NNFX_DOMAIN: ${NNFX_DOMAIN:?set NNFX_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  beta-db:
  market-data:
  orderbook-data:
  caddy-data:
