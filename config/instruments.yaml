# Instrument basket and per-symbol overrides. Changing the universe is a config edit.
baskets:
  fx_28: fx_28          # expanded in code to the 28 majors/crosses, standard naming
  crypto_core: ["BTC/USDT:USDT", "ETH/USDT:USDT", "SOL/USDT:USDT", "XRP/USDT:USDT", "BNB/USDT:USDT"]
  # Nobitex spot (fetch with: nnfx fetch --feed nobitex --symbol BTC/USDT ...). Long only.
  # IRT markets quote in rials and need USDT/IRT bars for conversion to the account currency.
  nobitex: ["BTC/USDT", "ETH/USDT", "BTC/IRT", "ETH/IRT", "USDT/IRT"]

defaults:
  fx_spot:
    size_step: "1000"     # 0.01 lots
    min_size: "1000"
  crypto_perp:
    max_leverage: 20.0
    maintenance_margin_rate: 0.005
  crypto_spot:
    can_short: false

overrides:
  "BTC/USDT:USDT": { btc_beta: 1.0, depth: 50000000 }
  "ETH/USDT:USDT": { btc_beta: 1.1, depth: 20000000 }
  "SOL/USDT:USDT": { btc_beta: 1.4, depth: 5000000 }
  "XRP/USDT:USDT": { btc_beta: 1.2, depth: 5000000 }
  "BNB/USDT:USDT": { btc_beta: 0.9, depth: 5000000 }
  "BTC/USDT": { market_class: crypto_spot, btc_beta: 1.0 }
  "ETH/USDT": { market_class: crypto_spot, btc_beta: 1.1 }
  "BTC/IRT": { market_class: crypto_spot, btc_beta: 1.0 }
  "ETH/IRT": { market_class: crypto_spot, btc_beta: 1.1 }
  "USDT/IRT": { market_class: crypto_spot }
